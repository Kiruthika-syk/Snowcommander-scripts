# Static documentation site.
#
# Runs unprivileged: nginx listens on 8080 rather than 80 so no capability to
# bind a low port is required, and the container can drop ALL capabilities.

worker_processes  auto;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Writable temp paths, so the root filesystem can be mounted read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log  /dev/stdout  main;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    gzip              on;
    gzip_types        text/plain text/css application/javascript image/svg+xml;
    gzip_min_length   1024;

    server {
        listen       8080;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # This site is internal documentation; these headers cost nothing.
        add_header X-Content-Type-Options   "nosniff"        always;
        add_header X-Frame-Options          "SAMEORIGIN"     always;
        add_header Referrer-Policy          "no-referrer"    always;
        # The page is entirely self-contained: no external scripts, styles,
        # fonts or images, so a strict policy will not break it.
        add_header Content-Security-Policy
            "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:"
            always;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
